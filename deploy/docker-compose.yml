# InfraPilot — production stack. Managed by install.sh / update.sh; values come from .env.
name: infrapilot

x-app: &app
  image: ${IP_IMAGE_API:-infrapilot/api:1.1.1}
  restart: unless-stopped
  env_file: .env
  environment:
    IP_VAULT_KEY_FILE: /run/secrets/vault_key
    IP_DATABASE_PASSWORD_FILE: /run/secrets/db_password
    IP_DATABASE_URL: "mssql+pyodbc://infrapilot_app:{password}@mssql:1433/${IP_DB_NAME:-infrapilot}?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes"
  secrets: [vault_key, db_password]
  volumes:
    - ./certs:/opt/infrapilot/certs:ro
    # Device backup export folders (Settings -> Backup -> Folder on the server); same path inside and outside.
    # /mnt and /media use rslave so a NAS share or USB disk mounted after start-up is visible too.
    - { type: bind, source: /srv/infrapilot-exports, target: /srv/infrapilot-exports, bind: { create_host_path: true } }
    - { type: bind, source: /mnt, target: /mnt, bind: { propagation: rslave, create_host_path: true } }
    - { type: bind, source: /media, target: /media, bind: { propagation: rslave, create_host_path: true } }
  networks: [backnet]
  read_only: true
  tmpfs: ["/tmp:mode=1777"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
  depends_on:
    mssql: { condition: service_healthy }

services:
  mssql:
    image: ${IP_IMAGE_MSSQL:-mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04}
    restart: unless-stopped
    env_file: ./secrets/mssql.env           # ACCEPT_EULA, MSSQL_PID, MSSQL_SA_PASSWORD (root-only file)
    environment:
      MSSQL_MEMORY_LIMIT_MB: ${IP_MSSQL_MEMORY_MB:-2048}
      MSSQL_BACKUP_DIR: /var/opt/mssql/backup
    volumes:
      - mssql-data:/var/opt/mssql
      - ./backups/mssql:/var/opt/mssql/backup
    networks: [backnet]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging: *logging

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${IP_API_WORKERS:-2}", "--proxy-headers", "--forwarded-allow-ips", "*"]
    networks: [backnet, frontnet, mgmtnet]   # API runs interactive connectivity tests and read-only operations
    cap_add: [NET_RAW]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/healthz',timeout=4).status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    networks: [backnet, mgmtnet]             # mgmtnet: outbound to managed devices (SSH/WinRM/APIs/SNMP)
    cap_add: [NET_RAW]                       # ICMP availability checks
    volumes:
      - ./certs:/opt/infrapilot/certs:ro
      - runner-data:/var/lib/infrapilot/runner
      # Device backup export folders (Settings -> Backup -> Folder on the server); same path inside and outside.
      # /mnt and /media use rslave so a NAS share or USB disk mounted after start-up is visible too.
      - { type: bind, source: /srv/infrapilot-exports, target: /srv/infrapilot-exports, bind: { create_host_path: true } }
      - { type: bind, source: /mnt, target: /mnt, bind: { propagation: rslave, create_host_path: true } }
      - { type: bind, source: /media, target: /media, bind: { propagation: rslave, create_host_path: true } }
    stop_grace_period: 5m                    # let running jobs finish
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "worker-health", "--max-age", "180"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s

  proxy:
    image: ${IP_IMAGE_PROXY:-infrapilot/proxy:1.1.1}
    restart: unless-stopped
    ports:
      - "${IP_HTTPS_BIND:-0.0.0.0}:${IP_HTTPS_PORT:-443}:8443"
      - "${IP_HTTP_BIND:-0.0.0.0}:${IP_HTTP_PORT:-80}:8080"
    volumes:
      - ./certs/tls.crt:/etc/nginx/certs/tls.crt:ro
      - ./certs/tls.key:/etc/nginx/certs/tls.key:ro
    networks: [frontnet]
    read_only: true
    tmpfs: ["/tmp:mode=1777", "/var/cache/nginx:uid=101,gid=101,mode=0700"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  # One-off administrative container (installer / maintenance scripts only)
  tools:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    networks: [backnet, mgmtnet]              # mgmtnet: backup upload to the network share (SMB 445)
    secrets: [vault_key, db_password, mssql_sa_password]
    command: ["python", "-m", "app.cli", "--help"]

networks:
  backnet: { internal: true }   # database only - no route outside the host
  frontnet: {}                  # proxy <-> api
  mgmtnet: {}                   # api/worker -> managed devices on your networks

volumes:
  mssql-data:
  runner-data:

secrets:
  vault_key: { file: ./secrets/vault_key }
  db_password: { file: ./secrets/db_password }
  mssql_sa_password: { file: ./secrets/mssql_sa_password }
