---
- name: Restart a systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Restart {{ service_name }}
      ansible.builtin.systemd_service:
        name: "{{ service_name }}"
        state: restarted
    - name: Verify service is active
      ansible.builtin.command: systemctl is-active {{ service_name | quote }}
      register: active
      changed_when: false
      failed_when: active.stdout != 'active'
