---
- name: Linux security baseline
  hosts: all
  become: true
  gather_facts: true
  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"
        state: reloaded
  tasks:
    - name: SSH hardening drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/91-infrapilot-baseline.conf
        mode: "0600"
        content: |
          # Managed by InfraPilot security baseline
          PermitRootLogin {{ 'no' if disable_root_ssh | bool else 'prohibit-password' }}
          PasswordAuthentication {{ 'no' if disable_password_ssh | bool else 'yes' }}
          X11Forwarding no
          MaxAuthTries 4
          ClientAliveInterval 300
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd
    - name: Kernel network hardening
      ansible.posix.sysctl:
        name: "{{ item.k }}"
        value: "{{ item.v }}"
        sysctl_file: /etc/sysctl.d/90-infrapilot.conf
        reload: true
      loop:
        - { k: net.ipv4.conf.all.accept_redirects, v: "0" }
        - { k: net.ipv4.conf.all.send_redirects, v: "0" }
        - { k: net.ipv4.conf.all.rp_filter, v: "1" }
        - { k: net.ipv4.tcp_syncookies, v: "1" }
    - name: UFW - allow required ports (Debian family)
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ allowed_tcp_ports }}"
      when: enable_firewall | bool and ansible_facts.os_family == 'Debian'
    - name: UFW - enable with default deny incoming
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
      when: enable_firewall | bool and ansible_facts.os_family == 'Debian'
    - name: firewalld - allow required ports (RHEL family)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ allowed_tcp_ports }}"
      when: enable_firewall | bool and ansible_facts.os_family == 'RedHat'
