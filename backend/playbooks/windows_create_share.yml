---
- name: Create folder and SMB share
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure folder exists
      ansible.windows.win_file:
        path: "{{ share_path }}"
        state: directory
    - name: Ensure share exists
      ansible.windows.win_share:
        name: "{{ share_name }}"
        path: "{{ share_path }}"
        full: "{{ full_access | join(',') if full_access else omit }}"
        change: "{{ change_access | join(',') if change_access else omit }}"
        read: "{{ read_access | join(',') if read_access else omit }}"
        list: false
        state: present
