---
- name: Install software from a file share
  hosts: all
  gather_facts: false
  tasks:
    - name: Install package {{ package_path }}
      ansible.windows.win_package:
        path: "{{ package_path }}"
        product_id: "{{ product_id }}"
        arguments: "{{ arguments }}"
        state: present
      register: pkg
    - name: Report reboot requirement
      ansible.builtin.debug:
        msg: "Reboot required: {{ pkg.reboot_required | default(false) }}"
